name: Publish MuscleScout snapshot
on:
  workflow_dispatch:
    inputs:
      base_path:
        description: 'Use /REPOSITORY for project Pages, or empty for a user site'
        required: false
        default: '/ClassicCars'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: musclescout-pages
  cancel-in-progress: true
jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ inputs.base_path }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - uses: actions/deploy-pages@v4
        id: deployment
