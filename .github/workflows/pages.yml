name: Publish MuscleScout snapshot
on:
  workflow_dispatch:
    inputs:
      base_path:
        description: "Use /REPOSITORY for project Pages, or empty for a user site"
        required: false
        default: "/ClassicCars"
permissions:
  contents: read
concurrency:
  group: musclescout-pages
  cancel-in-progress: true
jobs:
  pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run verify:travel
      - run: npm run sbom:validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ inputs.base_path }}
      - run: npm run verify:travel -- --public=out
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Package static output
        run: tar --dereference --hard-dereference --directory out --exclude=.git --exclude=.github -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
