name: Validate MuscleScout
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: musclescout-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        node: ["24"]
        include:
          - os: ubuntu-24.04
            node: "22.18.0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:release
      - run: node -e "require('node:fs').copyFileSync('docs/sbom/lockfile-inventory.json','baseline-sbom.json')"
      - run: npm run sbom
      - run: npm run sbom:artifacts
      - run: npm run sbom:validate
      - run: node scripts/compare-sbom.mjs baseline-sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sbom-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            docs/sbom
            test-results/sbom-diff.json
          retention-days: 14
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build:exports
      - run: npm run verify:exports
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-validation
          path: test-results
          retention-days: 14
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --pull -t musclescout-ci .
      - run: docker run --rm musclescout-ci npm run test:release
      - name: Extract target container inventory
        shell: bash
        run: |
          container_id=$(docker create musclescout-ci)
          trap 'docker rm "$container_id"' EXIT
          mkdir -p test-results/container-sbom
          docker cp "$container_id:/app/docs/sbom/." test-results/container-sbom
          docker image inspect musclescout-ci > test-results/container-image.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-sbom
          path: |
            test-results/container-sbom
            test-results/container-image.json
          retention-days: 14
